services:
  - type: web
    name: where-am-i
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    envVars:
      # Public URL of our TTS server (Phase 2). Not a secret. The ElevenLabs key lives ONLY on that server.
      - key: VITE_TTS_ENDPOINT
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
