name: Build area data

# Rebuilds public/data/areas/*.json and public/audit.html, runs the data tests, and commits the result.
#
# When it runs:
#   - automatically on a push that changes pipeline/** (code, wording rules, review files): rebuild from
#     the cached source downloads, about 1-2 minutes, nothing to start by hand;
#   - weekly (Sunday night): refresh every source, then rebuild;
#   - by hand (Actions tab, "Run workflow"): choose which sources to refresh ("none" = cache only).
# App-only pushes (src/**) do not need this workflow: Render deploys them directly.
#
# Source downloads are kept between runs in the GitHub Actions cache; each cached file records its own
# pull date. The Logainm key stays in the repository secret LOGAINM_API_KEY and is only used when Logainm
# is (re)fetched.
on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - '.github/workflows/build-area-data.yml'
  schedule:
    - cron: '17 2 * * 1'   # Monday 02:17 UTC
  workflow_dispatch:
    inputs:
      counties:
        description: 'Counties (space-separated, as Logainm names them)'
        required: true
        default: 'Kildare Dublin'
      refresh:
        description: 'Sources to re-download: none, all, or names (logainm boundaries heritage npws waterways rps gsi commons dib census)'
        required: true
        default: 'none'

permissions:
  contents: write

concurrency:
  group: build-area-data
  cancel-in-progress: true   # a newer run replaces an older one

env:
  COUNTIES: ${{ inputs.counties || 'Kildare Dublin' }}
  REFRESH: ${{ github.event_name == 'schedule' && 'all' || inputs.refresh || 'none' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the final rebase onto newer pushes always works

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Restore cached source downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache
            !pipeline/cache/report_*.json
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Fetch sources that are missing from the cache or asked to refresh
        env:
          LOGAINM_API_KEY: ${{ secrets.LOGAINM_API_KEY }}
        run: python pipeline/fetch_all.py --counties "$COUNTIES" --refresh $REFRESH

      - name: Save source downloads for the next run
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache
            !pipeline/cache/report_*.json
          key: sources-${{ github.run_id }}

      - name: Build area files
        run: cd pipeline && python build_areas.py $(echo "$COUNTIES" | tr '[:upper:]' '[:lower:]')

      - name: Data tests (must pass before anything is committed)
        run: cd pipeline && python -m pytest -q

      - name: Spoken-lines audit page (public/audit.html)
        run: python pipeline/audit_report.py

      - name: Keep the build reports
        uses: actions/upload-artifact@v4
        with:
          name: area-build-reports
          path: pipeline/cache/report_*.json

      - name: Commit rebuilt area data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/areas public/audit.html
          if git diff --cached --quiet; then
            echo "Area data unchanged."
          else
            git commit -m "data: rebuild area files ($COUNTIES; refresh: $REFRESH) via Build area data workflow"
            # code may have been pushed while this run was building: replay the data commit on top
            # (the workflow is the only writer of these files, so this cannot conflict with code changes)
            git pull --rebase origin main
            git push
          fi
