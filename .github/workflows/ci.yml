name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Hosting is on Render (auto-deploys from main). GitHub Pages deploy removed 2026-11-04.
permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  pipeline-tests:
    name: Data pipeline + area data integrity (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - run: cd pipeline && python -m pytest -q

  build:
    name: TypeScript Check & Production Build
    needs: [test, pipeline-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Build
        run: npm run build

      - name: Secret guard (no API keys or direct ElevenLabs calls in the public bundle)
        run: |
          if grep -rEq "sk_[A-Za-z0-9]{20,}|xi-api-key|api\.elevenlabs\.io" dist/; then
            echo "::error::Secret or direct ElevenLabs call found in dist/. Keys belong on the server only."
            exit 1
          fi
          echo "No secrets in bundle."
